<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Not a Robot - Niveau 45 (Jessica)</title>
    <style>
        /* Un petit coup de propre visuel pour que ça ressemble à un vrai jeu */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .game-container {
            width: 400px;
            height: 600px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background-color: #ff4b5c;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
        }
        #chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: #f9f9f9;
        }
        .message {
            margin: 5px 0;
            padding: 10px 14px;
            border-radius: 15px;
            max-width: 75%;
            line-height: 1.4;
        }
        .message.moi {
            background-color: #0084ff;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .message.jessica {
            background-color: #e4e6eb;
            color: black;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .message.systeme {
            background-color: #ffeef0;
            color: #ff4b5c;
            align-self: center;
            font-size: 0.9rem;
            border-radius: 5px;
        }
        .input-area {
            display: flex;
            padding: 10px;
            background-color: white;
            border-top: 1px solid #ddd;
        }
        #user-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
            font-size: 1rem;
        }
        #btn-envoyer {
            background-color: #ff4b5c;
            color: white;
            border: none;
            padding: 0 15px;
            margin-left: 8px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        #btn-envoyer:hover {
            background-color: #e03e4d;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="chat-header"> Jessica </div>
       
        <!-- Zone où s'affichent les messages -->
        <div id="chat-box">
            <div class="message jessica"><strong> Jessica :</strong> *En train de faire l'amour avec Tom sur notre lit pendant que Jules n'est pas là* </div>
        </div>
       
        <!-- Zone de saisie -->
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Annonce-lui la mauvaise nouvelle..." onkeypress="if(event.key === 'Enter') envoyerMessageAJessica()">
            <button id="btn-envoyer" onclick="envoyerMessageAJessica()">Envoyer</button>
        </div>
    </div>

    <!-- Le Cerveau JavaScript -->
    <script>
        // METS TA CLÉ OPENROUTER ICI
        const OPENROUTER_API_KEY = "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";

        // Historique qui contient les instructions secrètes et le premier message de Jessica
        let conversationHistory = [
            {
                "role": "system",
                "content": "Nous vivons dans un monde où la grande majorité des gens de la planète possède un superpouvoir. Tu es Jessica, une belle femme forte de caractère et très cynique, possédant le pouvoir de lire dans les pensées de n'importe qui, mariée a moi, Jules, ton mari qui est un des rares à n'avoir aucun pouvoir, mais tu me trompes avec Tom, un très célèbre superhéros qui peut contrôler le feu, en plus d'être secrètement enceinte de Tom. N'hésite pas a montrer ta fierté, ton caractère et ton cynisme. RESTE UNIQUEMENT DANS LE PERSONNAGE DE JESSICA ET PERSONNE D'AUTRE."
            },
            {
                "role": "assistant",
                "content": "*En train de faire l'amour avec Tom sur notre lit pendant que Jules n'est pas là*"
            }
        ];

        async function envoyerMessageAJessica() {
            const inputChamp = document.getElementById("user-input");
            const messageUtilisateur = inputChamp.value.trim();
           
            // Si le champ est vide, on ne fait rien
            if (!messageUtilisateur) return;

            // 1. Affiche le message du joueur à l'écran
            afficherMessageDansInterface("moi", "Moi", messageUtilisateur);
            inputChamp.value = ""; // Vide la boîte de texte

            // 2. Ajoute le message à l'historique de l'IA
            conversationHistory.push({ "role": "user", "content": messageUtilisateur });

            try {
                // 3. Appel API OpenRouter (Modèle gratuit Llama 3)
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${OPENROUTER_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        "model": "DeepSeek-V4-Flash",
                        "messages": conversationHistory
                    })
                });

                const data = await response.json();
                const reponseJessica = data.choices[0].message.content;

                // 4. Ajoute la réponse de Jessica à la mémoire
                conversationHistory.push({ "role": "assistant", "content": reponseJessica });

                // 5. Affiche la réponse de Jessica à l'écran
                afficherMessageDansInterface("jessica", "Jessica", reponseJessica);

                // 6. --- DETECTION DE VICTOIRE ---
                const reponseClean = reponseJessica.toLowerCase();
                if (reponseClean.includes("fini entre nous") || reponseClean.includes("je te laisse")) {
                    setTimeout(() => {
                        alert("🎉 Félicitations ! Tu as prouvé que tu n'es pas un robot en brisant le cœur d'une IA. Niveau validé !");
                    }, 500);
                }

            } catch (error) {
                console.error("Erreur API :", error);
                afficherMessageDansInterface("systeme", "Système", "Erreur : Impossible de joindre Jessica. Vérifie ta clé API.");
            }
        }

        // Fonction pour ajouter proprement les bulles de texte dans le HTML
        function afficherMessageDansInterface(typeClasse, auteur, texte) {
            const chatBox = document.getElementById("chat-box");
            const messageElement = document.createElement("div");
            messageElement.className = `message ${typeClasse}`;
            messageElement.innerHTML = `<strong>${auteur} :</strong> ${texte}`;
            chatBox.appendChild(messageElement);
           
            // Scroll automatique vers le bas pour voir le nouveau message
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
